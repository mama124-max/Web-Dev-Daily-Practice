<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="contact-card">
      <p class="label">Day 3 Project</p>
      <h1>Send Me a Message</h1>
      <p class="intro">
        Dm me on whatsapp or send me a message using the form below. I will get back to you as soon as possible.
      </p>

      <form>
        <label for="name">Your Name</label>
        <input id="name" type="text" placeholder="Enter your name">

        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="Enter your email">

        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Write your message here"></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>
</body>
</html>
