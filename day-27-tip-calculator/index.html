<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 27 - Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator-card">
        <header class="card-header">
            <h2>Tip & Split Calculator</h2>
            <p>Calculate tips and divide bills easily.</p>
        </header>

        <div class="calculator-body">
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-group">
                    <label for="bill">Bill Total ($)</label>
                    <input type="number" id="bill" placeholder="0.00" min="0" step="0.01">
                </div>

                <div class="input-group">
                    <label>Select Tip %</label>
                    <div class="tip-grid">
                        <button class="tip-btn" data-tip="5">5%</button>
                        <button class="tip-btn" data-tip="10">10%</button>
                        <button class="tip-btn active" data-tip="15">15%</button>
                        <button class="tip-btn" data-tip="20">20%</button>
                        <button class="tip-btn" data-tip="25">25%</button>
                        <input type="number" id="custom-tip" placeholder="Custom" min="0">
                    </div>
                </div>

                <div class="input-group">
                    <label for="people">Number of People</label>
                    <input type="number" id="people" value="1" min="1">
                </div>
            </div>

            <!-- Display Section -->
            <div class="results-section">
                <div class="result-row">
                    <div>
                        <span class="result-label">Tip Amount</span>
                        <span class="result-sub">/ person</span>
                    </div>
                    <span class="result-value" id="tip-per-person">$0.00</span>
                </div>

                <div class="result-row">
                    <div>
                        <span class="result-label">Total Amount</span>
                        <span class="result-sub">/ person</span>
                    </div>
                    <span class="result-value" id="total-per-person">$0.00</span>
                </div>

                <button id="reset-btn" class="reset-btn">Reset</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
