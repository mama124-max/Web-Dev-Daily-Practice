<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 8 - Testimonial Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card-container">
        <div class="profile">
            <div class="avatar">M</div>
            <div>
                <h3 id="author-name">Mama</h3>
                <p class="role">Frontend Developer Student</p>
            </div>
        </div>

        <p class="quote" id="quote-text"></p>

        <div class="card-footer">
            <button id="like-btn">❤️ Helpful (<span id="like-count">0</span>)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
