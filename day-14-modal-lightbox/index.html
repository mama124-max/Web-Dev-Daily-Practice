<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeeTrio Photo Lightbox</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="gallery-container">
        <div class="header">
            <span class="tag">PORTFOLIO</span>
            <h2>Featured Works</h2>
            <p>Click any photo to view in high resolution</p>
        </div>

        <!-- Thumbnail Grid -->
        <div class="grid">
            <div class="card"
                data-full="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&q=80"
                data-caption="Editorial Portrait Session">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80"
                    alt="Editorial Portrait">
                <div class="overlay"><span>View Full</span></div>
            </div>

            <div class="card"
                data-full="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1200&q=80"
                data-caption="Urban Street Fashion Shoot">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=400&q=80"
                    alt="Urban Street Fashion">
                <div class="overlay"><span>View Full</span></div>
            </div>

            <div class="card"
                data-full="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1200&q=80"
                data-caption="Golden Hour Studio Lighting">
                <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=400&q=80"
                    alt="Golden Hour Shoot">
                <div class="overlay"><span>View Full</span></div>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal Overlay -->
    <div class="modal" id="lightbox-modal">
        <span class="close-btn" id="modal-close">&times;</span>
        <div class="modal-content">
            <img id="modal-img" src="" alt="Expanded View">
            <p id="modal-caption" class="caption"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
